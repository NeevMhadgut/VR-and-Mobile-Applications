<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile SBS VR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); color: white; display: flex; 
            align-items: center; justify-content: center; flex-direction: column;
            font-family: sans-serif; z-index: 999;
        }
        button { 
            padding: 15px 30px; font-size: 20px; border-radius: 8px; 
            cursor: pointer; margin-top: 20px; background: #fff; color: #000; border: none;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <h2>Cardboard SBS VR</h2>
        <p>Place your phone in a VR headset after starting</p>
        <button id="startButton">Enable Sensors & Start</button>
    </div>

    <!-- Import Three.js and the SBS/Sensor plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/StereoEffect.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DeviceOrientationControls.js"></script>

    <script>
        let camera, scene, renderer, effect, controls;

        document.getElementById('startButton').addEventListener('click', () => {
            // Modern iOS devices require explicit permission to read orientation sensors
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(permissionState => {
                    if (permissionState === 'granted') initVR();
                    else alert("Sensor permission denied. Reload and accept to use VR.");
                }).catch(console.error);
            } else {
                initVR(); // Android and older devices
            }
        });

        function initVR() {
            document.getElementById('overlay').style.display = 'none';

            // 1. Scene & Camera Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111122);
            camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 100);
            
            // 2. Renderer Setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // 3. Apply the Side-by-Side (SBS) Stereo Effect
            effect = new THREE.StereoEffect(renderer);
            effect.setSize(window.innerWidth, window.innerHeight);

            // 4. Attach Mobile Sensor Controls (Gyroscope + Accelerometer)
            controls = new THREE.DeviceOrientationControls(camera);

            // 5. Add a grid floor and random floating cubes to look at
            scene.add(new THREE.GridHelper(50, 50, 0x888888, 0x444444));
            
            const geometry = new THREE.BoxGeometry(1, 1, 1);
            for (let i = 0; i < 100; i++) {
                const material = new THREE.MeshBasicMaterial({ 
                    color: new THREE.Color().setHSL(Math.random(), 1, 0.5),
                    wireframe: true 
                });
                const cube = new THREE.Mesh(geometry, material);
                // Position cubes randomly in a radius around the user
                cube.position.set((Math.random() - 0.5) * 20, Math.random() * 10, (Math.random() - 0.5) * 20);
                scene.add(cube);
            }

            // 6. Request Fullscreen for maximum immersion
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }

            // Handle phone rotation (portrait to landscape)
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                effect.setSize(window.innerWidth, window.innerHeight);
            });

            // Start the frame rendering loop
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            // Read the phone's physical gyroscope sensors
            controls.update(); 
            // Render the scene twice (Left Eye and Right Eye)
            effect.render(scene, camera); 
        }
    </script>
</body>
</html>
