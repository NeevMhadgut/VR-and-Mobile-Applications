<!DOCTYPE html>
<html>
  <head>
    <title>VR Head Tracking & Teleportation</title>
    <!-- A-Frame Core Library -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    
    <!-- Teleport Controls Component -->
    <script src="https://rawgit.com/fernandojsg/aframe-teleport-controls/master/dist/aframe-teleport-controls.min.js"></script>
  </head>
  <body>
    <a-scene>
      <!-- Background sky and a large ground plane to teleport onto -->
      <a-sky color="#87CEEB"></a-sky>
      <a-plane position="0 0 0" rotation="-90 0 0" width="30" height="30" color="#7BC8A4"></a-plane>

      <!-- 3D Objects scattered around to give you visual reference when looking around and teleporting -->
      <a-box position="-2 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-cylinder position="2 0.75 -3" radius="0.5" height="1.5" color="#FFC65D"></a-cylinder>
      <a-cone position="0 1 4" radius-bottom="1" height="2" color="#9b59b6"></a-cone>
      <a-box position="-6 1 2" depth="2" height="2" width="2" color="#F1C40F"></a-box>

      <!-- The Camera Rig: Groups your head and hands together so they teleport as one unit -->
      <a-entity id="cameraRig" position="0 0 0">
        
        <!-- The user's head (look-controls handles the head tracking) -->
        <a-entity id="head" camera look-controls position="0 1.6 0"></a-entity>

        <!-- Left Hand Controller for Teleportation -->
        <a-entity id="left-hand"
                  teleport-controls="cameraRig: #cameraRig; teleportOrigin: #head; button: trigger"
                  vive-controls="hand: left"
                  oculus-touch-controls="hand: left"
                  windows-motion-controls="hand: left">
        </a-entity>

        <!-- Right Hand Controller for Teleportation -->
        <a-entity id="right-hand"
                  teleport-controls="cameraRig: #cameraRig; teleportOrigin: #head; button: trigger"
                  vive-controls="hand: right"
                  oculus-touch-controls="hand: right"
                  windows-motion-controls="hand: right">
        </a-entity>
        
      </a-entity>
    </a-scene>
  </body>
</html>
